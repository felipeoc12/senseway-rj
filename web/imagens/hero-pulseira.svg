<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Pulseira SenseWay emitindo ondas em direção a um obstáculo">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe8f7"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
  </defs>
  <rect width="560" height="460" fill="url(#ceu)"/>
  <!-- prédios ao fundo -->
  <g fill="#b9cbe2">
    <rect x="20" y="120" width="70" height="200"/>
    <rect x="100" y="80" width="60" height="240"/>
    <rect x="390" y="100" width="80" height="220"/>
    <rect x="478" y="150" width="62" height="170"/>
  </g>
  <g fill="#e7eef8">
    <rect x="34" y="140" width="14" height="18"/><rect x="62" y="140" width="14" height="18"/>
    <rect x="34" y="176" width="14" height="18"/><rect x="62" y="176" width="14" height="18"/>
    <rect x="114" y="100" width="12" height="16"/><rect x="136" y="100" width="12" height="16"/>
    <rect x="114" y="132" width="12" height="16"/><rect x="136" y="132" width="12" height="16"/>
    <rect x="406" y="120" width="16" height="18"/><rect x="438" y="120" width="16" height="18"/>
    <rect x="406" y="156" width="16" height="18"/><rect x="438" y="156" width="16" height="18"/>
  </g>
  <!-- calçada -->
  <rect y="320" width="560" height="140" fill="#c9ced8"/>
  <rect y="320" width="560" height="10" fill="#9aa3b2"/>
  <!-- piso tátil -->
  <g fill="#f5b700">
    <rect x="0" y="372" width="300" height="26" rx="3"/>
    <rect x="352" y="372" width="208" height="26" rx="3"/>
  </g>
  <g fill="#d99f00">
    <rect x="12" y="378" width="276" height="3"/><rect x="12" y="386" width="276" height="3"/>
    <rect x="364" y="378" width="184" height="3"/><rect x="364" y="386" width="184" height="3"/>
  </g>
  <!-- obstáculo (poste e lixeira) -->
  <rect x="430" y="170" width="16" height="190" rx="4" fill="#4a5568"/>
  <rect x="396" y="290" width="58" height="70" rx="8" fill="#2f6f4f"/>
  <rect x="392" y="282" width="66" height="12" rx="4" fill="#24563d"/>
  <!-- ondas -->
  <g fill="none" stroke="#0b3b6f" stroke-linecap="round" stroke-width="7">
    <path d="M250 236a40 40 0 0 1 0 64" opacity=".9"/>
    <path d="M286 214a74 74 0 0 1 0 108" opacity=".65"/>
    <path d="M324 192a108 108 0 0 1 0 152" opacity=".4"/>
  </g>
  <!-- braço e pulseira -->
  <path d="M40 300 Q120 268 196 262 L214 300 Q130 312 60 344 Z" fill="#8d5a3b"/>
  <ellipse cx="236" cy="268" rx="26" ry="22" fill="#8d5a3b"/>
  <rect x="170" y="240" width="44" height="64" rx="12" fill="#0b3b6f"/>
  <rect x="180" y="256" width="24" height="32" rx="6" fill="#16263d"/>
  <circle cx="192" cy="264" r="5" fill="#ffc94d"/>
  <circle cx="192" cy="280" r="5" fill="#ffc94d"/>
  <!-- etiqueta de estado -->
  <g transform="translate(286 70)">
    <rect width="180" height="56" rx="28" fill="#ffffff" stroke="#b42318" stroke-width="3"/>
    <circle cx="30" cy="28" r="12" fill="#b42318"/>
    <text x="54" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b42318">PRÓXIMO</text>
  </g>
</svg>
