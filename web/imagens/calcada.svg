<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Calçada com piso tátil interrompido, buraco e poste no caminho">
  <rect width="520" height="360" fill="#e9eef5"/>
  <!-- rua -->
  <rect y="270" width="520" height="90" fill="#5b6472"/>
  <g fill="#f1f3f6"><rect x="30" y="310" width="60" height="8"/><rect x="160" y="310" width="60" height="8"/><rect x="290" y="310" width="60" height="8"/><rect x="420" y="310" width="60" height="8"/></g>
  <!-- meio-fio -->
  <rect y="258" width="520" height="14" fill="#9aa3b2"/>
  <!-- calçada com placas -->
  <rect y="120" width="520" height="140" fill="#cdd3dc"/>
  <g stroke="#b3bbc8" stroke-width="2">
    <path d="M0 165h520M0 212h520M80 120v140M180 120v140M290 120v140M400 120v140"/>
  </g>
  <!-- piso tátil interrompido -->
  <g fill="#f5b700">
    <rect x="0" y="178" width="150" height="24" rx="3"/>
    <rect x="250" y="178" width="70" height="24" rx="3"/>
    <rect x="430" y="178" width="90" height="24" rx="3"/>
  </g>
  <g fill="#d99f00">
    <rect x="8" y="184" width="134" height="3"/><rect x="8" y="192" width="134" height="3"/>
    <rect x="258" y="184" width="54" height="3"/><rect x="258" y="192" width="54" height="3"/>
    <rect x="438" y="184" width="74" height="3"/><rect x="438" y="192" width="74" height="3"/>
  </g>
  <!-- placa quebrada / buraco -->
  <path d="M168 170 l40 -6 l22 18 l-8 30 l-46 6 l-18 -24 z" fill="#3b4250"/>
  <path d="M176 176 l30 -4 l14 12 l-6 20 l-32 4 l-12 -16 z" fill="#232833"/>
  <!-- poste sobre o piso tátil -->
  <rect x="352" y="20" width="18" height="190" rx="4" fill="#4a5568"/>
  <rect x="336" y="200" width="50" height="12" rx="4" fill="#3b4250"/>
  <!-- marcadores -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <g transform="translate(150 70)"><rect width="128" height="34" rx="17" fill="#b42318"/><text x="64" y="23" text-anchor="middle" fill="#fff">Buraco</text></g>
    <path d="M200 104 L196 160" stroke="#b42318" stroke-width="3"/>
    <g transform="translate(392 70)"><rect width="110" height="34" rx="17" fill="#8a5300"/><text x="55" y="23" text-anchor="middle" fill="#fff">Poste</text></g>
    <path d="M392 88 L372 100" stroke="#8a5300" stroke-width="3"/>
    <g transform="translate(16 222)"><rect width="200" height="34" rx="17" fill="#0b3b6f"/><text x="100" y="23" text-anchor="middle" fill="#fff">Piso tátil interrompido</text></g>
  </g>
</svg>
